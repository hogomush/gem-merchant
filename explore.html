<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>탐험대</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="호섯의 보드게임방">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{background:radial-gradient(ellipse at top,#16324a 0%,#0e1520 65%)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.col{background:rgba(255,255,255,.04);border-radius:8px;padding:3px;min-height:40px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--c)}
.col.opp{flex-direction:column-reverse;border-top:0;border-bottom:3px solid var(--c)}
.mini{height:17px;border-radius:4px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--t);background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mini.new{animation:pop .5s ease}
.cs{font-size:11px;text-align:center;font-weight:800;margin-top:2px}
.cs.neg{color:#ff8f86}.cs.pos{color:#7dffa8}
.disc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.pile{aspect-ratio:3/4;border-radius:9px;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);display:flex;align-items:center;justify-content:center;position:relative}
.pile.can{border-style:solid;box-shadow:0 0 0 2px #5fd38d;cursor:pointer;animation:pickme 1s infinite}
@keyframes pickme{50%{filter:brightness(1.3)}}
.pile .cnt{position:absolute;bottom:-14px;font-size:10px;color:var(--dim)}
.cd{width:100%;aspect-ratio:3/4;border-radius:8px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Black Han Sans';font-size:22px;border:2px solid rgba(255,255,255,.5);box-shadow:0 3px 6px rgba(0,0,0,.4);position:relative}
.cd .em{font-size:15px;line-height:1}
.cd.w{font-size:18px}
.hand{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:6px 0}
.hand .cd{cursor:pointer;font-size:19px;transition:transform .15s}
.hand .cd.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--accent),0 8px 14px rgba(0,0,0,.5)}
.hand .cd.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3) rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.zone h4{margin:0 0 6px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.acts{display:flex;gap:6px}.acts .btn{margin:0;flex:1;padding:11px 6px;font-size:14px}
.tot{font-family:'Black Han Sans';font-size:18px;color:var(--accent)}
.res .row{justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="panel"></div><div id="modal"></div><div id="toast"></div><div id="banner"></div>
<script src="common.js"></script>
<script>
const CL={y:{n:'사막',em:'🏜️',c:'#e1b12c',t:'#2b1d00'},b:{n:'바다',em:'🌊',c:'#2e86de',t:'#fff'},g:{n:'정글',em:'🌴',c:'#27ae60',t:'#fff'},r:{n:'화산',em:'🌋',c:'#d63031',t:'#fff'},w:{n:'빙하',em:'🏔️',c:'#dfe6e9',t:'#22303a'}};
const CS=Object.keys(CL);
const curId=()=>G.order[G.turn];
const other=id=>G.order.find(x=>x!==id);
const lbl=v=>v===0?'🤝':v;
function expScore(cards){ if(!cards||!cards.length) return null; const w=cards.filter(c=>c.v===0).length, s=cards.reduce((a,c)=>a+c.v,0); return (s-20)*(1+w)+(cards.length>=8?20:0); }
function total(d,id){ return CS.reduce((a,c)=>a+(expScore(d.exp[id][c])||0),0); }
function canPlay(d,id,card){ const e=d.exp[id][card.c]; if(!e.length) return true; const top=e[e.length-1].v; return card.v===0 ? top===0 : card.v>top; }
function sortHand(h){ return h.sort((a,b)=>CS.indexOf(a.c)-CS.indexOf(b.c)||a.v-b.v); }
function setupRound(d){
  let deck=[]; CS.forEach(c=>{ for(let i=0;i<3;i++) deck.push({c,v:0}); for(let v=2;v<=10;v++) deck.push({c,v}); });
  deck=shuffle(deck).map((x,i)=>({...x,u:'k'+i+'_'+rnd(1e6)}));
  d.hands={}; d.exp={};
  d.order.forEach(id=>{ d.hands[id]=sortHand(deck.splice(0,8)); d.exp[id]=Object.fromEntries(CS.map(c=>[c,[]])); });
  d.deck=deck; d.disc=Object.fromEntries(CS.map(c=>[c,[]])); d.phase='play'; d.justDisc=null; d.res=null; d.turn=d.starter;
  addLog(d,`🧭 ${d.rnd}라운드 시작!`);
}
function roundEnd(d){
  const sc=Object.fromEntries(d.order.map(id=>[id,total(d,id)]));
  d.order.forEach(id=>d.score[id]+=sc[id]);
  d.phase='roundEnd'; d.res={sc};
  addLog(d,`덱이 바닥났어요! 이번 라운드 ${d.order.map(id=>d.players[id].name+' '+sc[id]).join(' · ')}`);
  if(d.rnd>=d.opts.rounds){ d.status='ended'; d.rank=d.order.slice().sort((a,b)=>d.score[b]-d.score[a]); addLog(d,'게임 종료! 우승: '+d.players[d.rank[0]].name); }
  else d.starter=(d.starter+1)%2;
}
function newLast(d,o){ d.last=Object.assign({seq:(G.v||0)+1,by:myId},o); }
async function doPlay(toExp){
  if(curId()!==myId||G.phase!=='play'||!sel) return;
  const d=clone(G), h=d.hands[myId], i=h.findIndex(c=>c.u===sel); if(i<0) return;
  const card=h[i];
  if(toExp){ if(!canPlay(d,myId,card)) return toast('더 큰 숫자만 놓을 수 있어요'); h.splice(i,1); d.exp[myId][card.c].push(card); d.justDisc=null;
    addLog(d,`${CL[card.c].em}${CL[card.c].n} 탐험에 ${card.v?card.v:'투자 🤝'}`,myId); newLast(d,{exp:card.c}); }
  else { h.splice(i,1); d.disc[card.c].push(card); d.justDisc=card.c; addLog(d,`${CL[card.c].em}${CL[card.c].n} ${lbl(card.v)} 버림`,myId); newLast(d,{disc:card.c}); }
  d.phase='draw'; sel=null; commit(d);
}
async function doDraw(from){
  if(curId()!==myId||G.phase!=='draw') return;
  const d=clone(G), h=d.hands[myId]; let card;
  if(from==='deck'){ card=d.deck.pop(); addLog(d,'덱에서 1장 뽑음',myId); }
  else { if(from===d.justDisc||!d.disc[from].length) return; card=d.disc[from].pop(); addLog(d,`버림 더미에서 ${CL[from].em}${lbl(card.v)} 가져옴`,myId); }
  h.push(card); sortHand(h); newLast(d,{draw:from,u:card.u});
  d.phase='play'; d.justDisc=null;
  if(!d.deck.length) roundEnd(d); else d.turn=1-d.turn;
  commit(d);
}
async function doNextRound(){ if(G.phase!=='roundEnd'||G.status!=='playing') return; const d=clone(G); d.rnd++; setupRound(d); d.last={seq:(G.v||0)+1,by:myId,round:1}; commit(d); }

let sel=null, lastSeen=null;
function cdHTML(c,cls='',attr=''){ return `<div class="cd ${c.v===0?'w':''} ${cls}" ${attr} style="--c:${CL[c.c].c};--t:${CL[c.c].t}"><div class="em">${CL[c.c].em}</div>${lbl(c.v)}</div>`; }
function colHTML(id,opp){
  return `<div class="cols">${CS.map(c=>{ const e=G.exp[id][c]; const s=expScore(e);
    return `<div><div class="col ${opp?'opp':''}" style="--c:${CL[c].c}">${e.map((x,i)=>`<div class="mini ${i===e.length-1&&G.last&&G.last.exp===c&&G.last.by===id?'new':''}" style="--c:${CL[c].c};--t:${CL[c].t}">${lbl(x.v)}</div>`).join('')}</div>
      <div class="cs ${s===null?'':s<0?'neg':'pos'}">${s===null?'·':s}</div></div>`; }).join('')}</div>`;
}
function render(prev){
  if(!G) return;
  const cur=curId(), my=cur===myId&&G.status==='playing'&&G.phase!=='roundEnd', op=other(myId);
  if(!my||G.phase!=='play') sel=null;
  const h=G.hands[myId]||[]; const sc=sel?h.find(c=>c.u===sel):null;
  const piles=CS.map(c=>{ const p=G.disc[c], top=p[p.length-1]; const can=my&&G.phase==='draw'&&p.length&&c!==G.justDisc;
    return `<div class="pile ${can?'can':''}" data-pile="${c}" style="--c:${CL[c].c}">${top?cdHTML(top):`<span style="opacity:.4">${CL[c].em}</span>`}<span class="cnt">${p.length?p.length+'장':''}</span></div>`; }).join('');
  let acts='';
  if(my&&G.phase==='play') acts = sc ? `<div class="acts"><button class="btn" id="pe" ${canPlay(G,myId,sc)?'':'disabled'}>${CL[sc.c].em} 탐험에 놓기</button><button class="btn sec" id="pd">🗑️ 버리기</button></div>${canPlay(G,myId,sc)?'':'<div class="tiny" style="margin-top:4px">이 탐험엔 더 큰 숫자만 놓을 수 있어요 (투자 🤝는 숫자 놓기 전에만)</div>'}`
    : `<div class="tiny"><b style="color:var(--accent)">내 차례!</b> 손패에서 카드 1장을 고르세요</div>`;
  else if(my&&G.phase==='draw') acts=`<div class="acts"><button class="btn" id="dd">🂠 덱에서 뽑기 (${G.deck.length}장)</button></div><div class="tiny" style="margin-top:4px">또는 초록 테두리 버림 더미를 탭해 가져오기 (방금 버린 색은 안 돼요)</div>`;
  else if(G.status==='playing'&&G.phase!=='roundEnd') acts=`<div class="tiny" style="text-align:center">${esc(nameOf(cur))}의 차례… ${G.phase==='draw'?'(카드 뽑는 중)':''}</div>`;
  let mid='';
  if(G.status==='ended') mid=endBoxHTML(G.rank.map(id=>({id,txt:`${G.score[id]}점`})));
  else if(G.phase==='roundEnd') mid=`<div class="card-box res"><b>${G.rnd}라운드 결과</b>${G.order.map(id=>`<div class="row"><span style="color:${pcol(id)}">${esc(nameOf(id))}${id===myId?' (나)':''}</span><span>${G.res.sc[id]>=0?'+':''}${G.res.sc[id]} → <b style="color:var(--accent)">${G.score[id]}점</b></span></div>`).join('')}<button class="btn" id="next">다음 라운드 (${G.rnd+1}/${G.opts.rounds})</button></div>`;
  $('#app').innerHTML=`
    <div class="topbar"><div><div class="turn ${my?'me':''}">${G.status==='ended'?'게임 종료':G.phase==='roundEnd'?'라운드 종료':my?'내 차례!':esc(nameOf(cur))+'의 차례'}</div>
      <div class="tiny">방 ${esc(G.code)} · <span class="net">${esc(netState)}</span> · ${G.rnd}/${G.opts.rounds}라운드 · 덱 ${G.deck.length}장</div></div>
      <button class="btn sec sm" id="menu">메뉴</button></div>
    ${mid}
    <div class="zone" data-pid="${op}" style="border-left:4px solid ${pcol(op)}"><h4><span><b style="color:#fff">${esc(nameOf(op))}</b> · 손패 ${G.hands[op].length}장</span><span class="tot">${total(G,op)}점 <span class="tiny">(누적 ${G.score[op]})</span></span></h4>${colHTML(op,true)}</div>
    <div class="disc">${piles}</div>
    <div class="zone" data-pid="${myId}" style="border-left:4px solid ${pcol(myId)}"><h4><span><b style="color:#fff">${esc(nameOf(myId))} (나)</b></span><span class="tot">${total(G,myId)}점 <span class="tiny">(누적 ${G.score[myId]})</span></span></h4>${colHTML(myId,false)}
      <div class="hand">${h.map(c=>cdHTML(c,`${sel===c.u?'sel':''} ${G.last&&G.last.u===c.u&&G.last.by===myId?'new':''}`,`data-u="${c.u}"`)).join('')}</div>${acts}</div>
    <div class="log">${(G.log||[]).slice().reverse().map(logHTML).join('')}</div>`;
  $('#menu').onclick=()=>openMenu();
  $('#next')&&($('#next').onclick=()=>{ $('#next').disabled=true; doNextRound(); });
  $('#again')&&($('#again').onclick=restartToLobby);
  if(my&&G.phase==='play') document.querySelectorAll('[data-u]').forEach(el=>el.onclick=()=>{ sel=sel===el.dataset.u?null:el.dataset.u; render(); });
  $('#pe')&&($('#pe').onclick=()=>doPlay(true)); $('#pd')&&($('#pd').onclick=()=>doPlay(false));
  $('#dd')&&($('#dd').onclick=()=>{ $('#dd').disabled=true; doDraw('deck'); });
  document.querySelectorAll('.pile.can').forEach(el=>el.onclick=()=>doDraw(el.dataset.pile));
  const L=G.last;
  if(L && lastSeen!==null && L.seq>lastSeen){ lastSeen=L.seq; const last=(G.log||[]).filter(l=>l.p===L.by).slice(-1)[0]; if(L.round) banner(null,`${G.rnd}라운드 시작!`); else if(last&&L.by!==myId) banner(L.by,last.t);
    if(L.disc){ const el=document.querySelector(`[data-pile="${L.disc}"] .cd`); el&&el.animate([{transform:'translateY(60px) scale(.6)',opacity:0},{transform:'none',opacity:1}],{duration:450,easing:'ease-out'}); } }
  else if(lastSeen===null) lastSeen=L?L.seq:0;
}

boot({
  id:'explore', title:'탐험대', sub:'5곳의 탐험에 카드를 순서대로 쌓아 점수를 내는 2인 대결', min:2, max:2,
  rules:`<li>내 차례엔 ① 카드 1장을 <b>내 탐험에 놓거나 버림 더미에 버리고</b> ② <b>덱이나 버림 더미에서 1장</b> 뽑아요.</li>
    <li>탐험에는 같은 색 카드를 <b>점점 큰 숫자</b>로만 놓을 수 있어요. 🤝 투자 카드는 숫자보다 먼저 놓아야 해요.</li>
    <li>점수 = (숫자 합 − 20) × (1 + 투자 장수). 시작만 하고 못 키우면 마이너스! 8장 이상이면 +20.</li>
    <li>덱이 바닥나면 라운드 끝. 정한 라운드 후 총점이 높은 사람이 승리.</li>`,
  defaultOpts:()=>({rounds:3}),
  lobbyOpts:(G,host)=>`<div class="muted opt-t">라운드 수 ${host?'':'(방장이 정해요)'}</div>${optButtons(G,host,'rounds',[[1,'1라운드','빠르게'],[3,'3라운드','기본']])}`,
  setup:d=>{ d.score=Object.fromEntries(d.order.map(id=>[id,0])); d.rnd=1; d.starter=0; setupRound(d); },
  render,
});
</script>
</body>
</html>
