<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>보석 상인 — 친구랑 하는 보석 카드 게임</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#17131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="호섯의 보드게임방">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17131f; --panel:#221c2d; --panel2:#2c2539; --line:#3d3450; --text:#f3eee6; --dim:#a99fba;
  --accent:#e8b923;
  --w:#f4f1ea; --u:#2f6fd6; --g:#1f9d63; --r:#d6453d; --k:#3b3330; --y:#e8b923;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
body{min-height:100vh;background:radial-gradient(ellipse at top,#2a2140 0%,var(--bg) 60%)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:10px 10px 140px}
h1{font-family:'Cinzel',serif;font-size:28px;margin:18px 0 4px;text-align:center;letter-spacing:2px;color:var(--accent)}
.sub{text-align:center;color:var(--dim);margin-bottom:18px}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:16px;font-family:inherit}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:0;font-size:15px;font-weight:700;background:var(--accent);color:#2a1d00;margin-top:10px}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--dim);font-size:12px}
.err{color:#ff8f86;font-size:13px;margin-top:8px;min-height:1em}
.code{font-family:'Cinzel',serif;font-size:34px;letter-spacing:8px;text-align:center;color:var(--accent);margin:6px 0}
.plist div{padding:8px 10px;background:var(--panel2);border-radius:8px;margin-top:6px;display:flex;justify-content:space-between}

/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.turn{font-weight:800;font-size:15px}
.turn.me{color:var(--accent)}
.tiny{font-size:11px;color:var(--dim)}
.opps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.opp.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opp-h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.pts{color:var(--accent);font-family:'Cinzel',serif}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mc{display:flex;align-items:center;gap:2px;font-size:11px;background:var(--panel2);padding:2px 5px;border-radius:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.35)}
.nobles{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.noble{width:62px;height:62px;border-radius:8px;background:linear-gradient(145deg,#6b4f8a,#3c2b52);border:1px solid #8e74ad;padding:4px;position:relative}
.noble .np{font-family:'Cinzel',serif;font-size:16px;color:#fff}
.noble .nr{position:absolute;bottom:4px;left:4px;right:4px;display:flex;gap:2px}
.req{width:15px;height:13px;border-radius:3px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tier{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px}
.deck{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cinzel',serif;color:#fff;aspect-ratio:3/4.1;border:1px solid rgba(255,255,255,.15)}
.deck.t1{background:linear-gradient(145deg,#3c8a4d,#1f4a29)}
.deck.t2{background:linear-gradient(145deg,#c9952c,#6b4b10)}
.deck.t3{background:linear-gradient(145deg,#3b67b5,#1c2f5c)}
.deck b{font-size:18px}.deck span{font-size:11px;opacity:.8}
.deck.empty{opacity:.25}
.gc{border-radius:8px;aspect-ratio:3/4.1;position:relative;padding:4px;border:1px solid rgba(0,0,0,.4);overflow:hidden;background:#ddd;color:#111}
.gc.empty{background:transparent;border:1px dashed var(--line)}
.gc .hd{display:flex;justify-content:space-between;align-items:flex-start;background:rgba(255,255,255,.55);margin:-4px -4px 0;padding:2px 4px;height:22px}
.gc .p{font-family:'Cinzel',serif;font-size:17px;line-height:18px;color:#111}
.gc .gem{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;margin:2px 2px 0 0;border:1px solid rgba(0,0,0,.4)}
.gc .cost{position:absolute;left:3px;bottom:3px;display:flex;flex-direction:column;gap:2px}
.gc .cost.g2{display:grid;grid-template-columns:repeat(2,17px)}
.cc{width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.4)}
.gc.can{box-shadow:0 0 0 2px var(--accent)}
.gc.sel{outline:3px solid #fff}
.bank{display:flex;justify-content:space-between;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.tok{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--text);padding:0;position:relative}
.chip{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:3px solid rgba(255,255,255,.25);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tok .pick{position:absolute;top:-4px;right:2px;background:#fff;color:#000;border-radius:10px;font-size:11px;font-weight:800;padding:0 5px}
.tok:disabled{opacity:.35}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--dim);max-height:96px;overflow:auto}
.log div{padding:1px 0}
.me-panel{position:fixed;left:0;right:0;bottom:0;background:#120f19ee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.me-in{max-width:520px;margin:0 auto}
.me-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.me-gems{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mg{background:var(--panel2);border-radius:8px;padding:4px 2px;text-align:center;font-size:11px}
.mg .t{font-weight:800;font-size:14px}
.mg .b{color:var(--dim)}
.resv{display:flex;gap:5px;margin-top:6px}
.resv .gc{width:52px}
.actionbar{display:flex;gap:6px;margin-top:6px}
.actionbar .btn{margin:0;padding:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{margin:0 0 10px}
.bigcard{width:120px;margin:0 auto 10px}
.bigcard .gc{transform-origin:top}
.winner{font-family:'Cinzel',serif;font-size:22px;color:var(--accent);text-align:center}
.help li{margin-bottom:6px;color:var(--dim)}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;font-size:13px;z-index:60}
.pill{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--panel2);color:var(--dim)}

/* ---- 그림 & 애니메이션 ---- */
.gc{border:2px solid #888;background:#222;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.gc .art{position:absolute;inset:0;z-index:0}
.gc .art svg{width:100%;height:100%;display:block}
.gc .hd{position:relative;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));align-items:center}
.gc .hd .bg{width:17px;height:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.gc .cost{z-index:1}
.gc .p{text-shadow:0 1px 0 #fff}
.slot{min-width:0}
.noble{overflow:hidden;padding:0;border:2px solid #c9a14a;background:#b89a6a;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.noble .nart{position:absolute;inset:0}.noble .nart svg,.noble>svg{width:100%;height:100%;display:block}
.noble .np{position:absolute;top:1px;left:4px;color:#3a2410;text-shadow:0 1px 0 #fff8;z-index:1}
.noble .nr{z-index:1;bottom:2px;left:2px;right:auto;flex-direction:row}
.chip{position:relative;color:transparent}
.chip .gsvg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.chip .cnt{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#120f19;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid #fff4}
.mg-ic{width:12px;height:12px;vertical-align:-2px}
.mg .mg-ic2{width:14px;height:14px;display:block;margin:0 auto 1px}
.deck{position:relative;overflow:hidden;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px)}
.deck.t1{background-color:#2e6b3b}.deck.t2{background-color:#9a6f1c}.deck.t3{background-color:#2b4f91}
.deck b{text-shadow:0 2px 3px rgba(0,0,0,.5)}
.opp{border-left:4px solid var(--pc)}
.me-panel{border-top:3px solid var(--pc)}
.log div{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px;flex-wrap:wrap}
.log div.mine{background:rgba(255,255,255,.06)}
.log div.sys{color:var(--accent)}
.log .dot{flex:none}
.fly{position:fixed;z-index:90;pointer-events:none}
.fly .chip{width:100%;height:100%;border-width:2px}
.fly .chip .gsvg{width:70%;height:70%}
.flycard .gc,.flycard .deck,.flycard .noble{width:100%;height:100%;aspect-ratio:auto}
.flycard{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.gc.deal{animation:deal .7s .45s cubic-bezier(.3,.7,.3,1) both}
@keyframes deal{from{transform:perspective(300px) rotateY(90deg) scale(.85);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 1.1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pc)}100%{box-shadow:0 0 0 14px transparent}}
#banner .bn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:95;background:#120f19ee;border:1px solid var(--pc);border-left:5px solid var(--pc);padding:8px 14px;border-radius:12px;font-size:13px;display:flex;gap:6px;align-items:center;animation:bn .3s ease-out;max-width:92vw}
@keyframes bn{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast{top:56px}

.hold{display:grid;grid-template-columns:44px repeat(6,1fr);gap:4px 5px;align-items:center;margin-top:3px}
.hold .hl{font-size:10px;color:var(--dim);white-space:nowrap}
.ctile{height:22px;border-radius:3px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));color:var(--t);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);position:relative}
.ctile:after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;transform:rotate(45deg);background:rgba(255,255,255,.7)}
.ctok{width:22px;height:22px;justify-self:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000));color:var(--t);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.55)}
.hold .zero{opacity:.22}
.hold.big{grid-template-columns:48px repeat(6,1fr);gap:5px 6px}
.hold.big .ctile{height:28px;font-size:15px}
.hold.big .ctok{width:30px;height:30px;font-size:14px}
.hold.big .hl{font-size:11px}

.mode{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.mode b{font-size:18px;font-family:'Cinzel',serif}.mode span{font-size:11px;color:var(--dim)}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:#3a2f1a}
.mode:disabled{opacity:1}.mode:disabled:not(.on){opacity:.45}
.order{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
.oc{padding:2px 8px;border-radius:10px;border:1px solid var(--pc);color:var(--pc)}
.oc.on{background:var(--pc);color:#120f19;font-weight:800}
.order-pop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:flex;align-items:center;justify-content:center;animation:bn .25s}
.op-in{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:20px 26px;min-width:220px;text-align:center}
.op-t{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:10px}
.op-r{font-size:17px;padding:6px 10px;margin-top:6px;border-radius:10px;border-left:5px solid var(--pc);background:var(--panel2);text-align:left;animation:opr .45s both}
.op-r b{color:var(--pc);margin-right:6px}
@keyframes opr{from{transform:translateX(-30px) scale(.9);opacity:0}to{transform:none;opacity:1}}

.ores{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ores .hl{font-size:10px;color:var(--dim);width:44px}
.ores .gc{width:46px;cursor:pointer}
.ores .gc .hd{height:16px}.ores .gc .p{font-size:13px;line-height:14px}.ores .gc .hd .bg{width:12px;height:12px}
.ores .gc .cc{width:13px;height:13px;font-size:9px}
.ores .gc .cost.g2{grid-template-columns:repeat(2,13px)}
.oback{width:46px;aspect-ratio:3/4.1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Cinzel',serif;font-size:15px;border:1px solid rgba(255,255,255,.2);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 5px,transparent 5px 10px)}
.oback small{font-family:'Noto Sans KR';font-size:8.5px;opacity:.85}
.oback.t1{background-color:#2e6b3b}.oback.t2{background-color:#9a6f1c}.oback.t3{background-color:#2b4f91}
#banner .bn b{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"><h1>GEM MERCHANT</h1><div class="sub">불러오는 중…</div></div>
<div id="panel"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="banner"></div>

<script>
// ===================== 데이터 =====================
const C = ['w','u','g','r','k'];            // 다이아, 사파이어, 에메랄드, 루비, 오닉스
const CN = {w:'다이아',u:'사파이어',g:'에메랄드',r:'루비',k:'오닉스',y:'황금'};
const CHEX = {w:'#f4f1ea',u:'#2f6fd6',g:'#1f9d63',r:'#d6453d',k:'#3b3330',y:'#e8b923'};
const CTXT = {w:'#222',u:'#fff',g:'#fff',r:'#fff',k:'#fff',y:'#2a1d00'};
const CBG = {w:'linear-gradient(160deg,#ffffff,#d9d4c7)',u:'linear-gradient(160deg,#6f9ef0,#244f9e)',g:'linear-gradient(160deg,#58c793,#16714a)',r:'linear-gradient(160deg,#f07b72,#9c2a23)',k:'linear-gradient(160deg,#7a6c66,#2a2321)'};

// 카드 패턴: 오프셋(0=자기 색) → 개수, 점수
const PAT = {
 1:[[{1:1,2:1,3:1,4:1},0],[{1:1,2:2,3:1,4:1},0],[{1:2,2:2,4:1},0],[{0:1,1:3,3:1},0],[{2:2,4:1},0],[{1:2,3:2},0],[{2:3},0],[{3:4},1]],
 2:[[{1:2,2:2,3:3},1],[{0:2,1:3,3:3},1],[{2:4,3:2,4:1},2],[{1:5,2:3},2],[{2:5},2],[{0:6},3]],
 3:[[{1:3,2:3,3:5,4:3},3],[{2:7},4],[{0:3,1:3,2:6},4],[{0:3,2:7},5]]
};
const CARDS = {};
for (const t of [1,2,3]) {
  let n=0;
  C.forEach((col,ci)=>{
    PAT[t].forEach(([pat,pts])=>{
      const cost={};
      for (const o in pat) cost[C[(ci+ +o)%5]] = pat[o];
      CARDS[t+'-'+n] = {id:t+'-'+n, tier:t, color:col, pts, cost};
      n++;
    });
  });
}
const NOBLES = {};
C.forEach((c,i)=>{
  NOBLES['n3-'+i] = {id:'n3-'+i, pts:3, req:{[c]:3,[C[(i+1)%5]]:3,[C[(i+2)%5]]:3}};
  NOBLES['n4-'+i] = {id:'n4-'+i, pts:3, req:{[c]:4,[C[(i+2)%5]]:4}};
});

// ===================== 상태 =====================
let room=null, G=null, unsub=null, loadTimer=null;
let picks=[];           // 은행에서 고른 토큰
let pending=null;       // 토큰 버리기 대기 상태
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rnd = n=>{try{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}catch(e){return Math.floor(Math.random()*n)}};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clone = o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML='',2200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ===================== 네트워크 (P2P: 방장 폰이 서버 역할) =====================
const PFX='gemmerchant-v1-';
let peer=null, conns=[], hostConn=null, isHost=false, DOC=null, docListeners=[], acks={}, active=false, netState='';
const myId = lsGet('gm_uid') || (()=>{const v='p'+Math.random().toString(36).slice(2,10);lsSet('gm_uid',v);return v})();
const myName = '';
function mergeDeep(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')mergeDeep(a[k],b[k]);else a[k]=b[k]}return a}
function mkSnap(){ const d=DOC; return {exists:!!d, data:()=>d, metadata:{fromCache:false}}; }
function emitDoc(){ docListeners.slice().forEach(f=>f(mkSnap())); }
function setNet(s){ netState=s; const el=document.getElementById('net'); if(el) el.textContent=s; }
function hostNetText(){ return '방장 · 친구 '+conns.filter(c=>c.open).length+'명 연결'; }
function hostApply(m){
  if(m.op==='set'){
    if(DOC && m.data && DOC.v!==undefined && m.data.v!==DOC.v+1) return false;
    DOC=m.data;
  } else if(m.op==='update'){ if(!DOC) return false; mergeDeep(DOC,m.data); }
  else if(m.op==='delete'){ DOC=null; }
  else return false;
  if(room){ if(DOC) lsSet('gm_doc_'+room, JSON.stringify(DOC)); else lsSet('gm_doc_'+room,''); }
  conns.forEach(c=>{ if(c.open) c.send({type:'doc',doc:DOC}); });
  emitDoc();
  return true;
}
function send(m){
  if(isHost){ return hostApply(clone(m)) ? Promise.resolve() : Promise.reject({message:'게임 상태가 바뀌었어요. 다시 시도해 주세요.'}); }
  if(!hostConn || !hostConn.open) return Promise.reject({message:'방장과 연결이 끊겨 있어요'});
  const rid=Math.random().toString(36).slice(2);
  return new Promise((res,rej)=>{
    acks[rid]={res,rej}; hostConn.send({...clone(m),rid});
    setTimeout(()=>{ if(acks[rid]){ delete acks[rid]; rej({message:'응답이 없어요 (방장 연결 확인)'}); } },8000);
  });
}
const db = { doc:()=>({
  get: async()=>mkSnap(),
  set: d=>send({op:'set',data:d}),
  update: d=>send({op:'update',data:d}),
  delete: ()=>send({op:'delete'}),
  onSnapshot: (f)=>{ docListeners.push(f); setTimeout(()=>f(mkSnap()),0); return ()=>{ docListeners=docListeners.filter(x=>x!==f); }; }
})};
function leaveNet(){
  active=false; docListeners=[]; DOC=null; conns=[]; hostConn=null; isHost=false;
  if(peer){ try{peer.destroy()}catch(e){} peer=null; }
}
function startHost(code, initial){
  leaveNet(); active=true; isHost=true; DOC=initial;
  return new Promise((res,rej)=>{
    let opened=false;
    peer=new Peer(PFX+code);
    peer.on('open',()=>{ opened=true; setNet(hostNetText()); res(); });
    peer.on('error',e=>{ if(!opened){ leaveNet(); rej(e); } else setNet('연결 문제: '+e.type); });
    peer.on('disconnected',()=>{ if(active){ setNet('서버 재연결 중…'); try{peer.reconnect()}catch(e){} } });
    peer.on('connection',c=>{
      c.on('open',()=>{ conns.push(c); c.send({type:'doc',doc:DOC}); setNet(hostNetText()); });
      c.on('data',m=>{ if(m && m.op){ const ok=hostApply(m); c.send({type:'ack',rid:m.rid,ok}); } });
      c.on('close',()=>{ conns=conns.filter(x=>x!==c); setNet(hostNetText()); });
      c.on('error',()=>{});
    });
  });
}
function startClient(code){
  leaveNet(); active=true; isHost=false;
  return new Promise((res,rej)=>{
    let first=true, timer;
    const fail=msg=>{ if(first){ first=false; clearTimeout(timer); leaveNet(); rej(new Error(msg)); } };
    timer=setTimeout(()=>fail('연결 시간이 초과됐어요. 방 코드와 방장 접속 상태를 확인해 주세요.'),15000);
    peer=new Peer();
    function connect(){
      if(!active||!peer||peer.destroyed) return;
      const c=peer.connect(PFX+code,{reliable:true}); hostConn=c;
      c.on('open',()=>setNet('연결됨'));
      c.on('data',m=>{
        if(m.type==='doc'){ DOC=m.doc; emitDoc(); if(first){ first=false; clearTimeout(timer); res(); } }
        else if(m.type==='ack' && acks[m.rid]){ const a=acks[m.rid]; delete acks[m.rid]; m.ok?a.res():a.rej({message:'게임 상태가 바뀌었어요. 다시 시도해 주세요.'}); }
      });
      c.on('close',()=>{ if(active && hostConn===c){ setNet('방장과 재연결 중…'); setTimeout(connect,3000); } });
      c.on('error',()=>{});
    }
    peer.on('open',connect);
    peer.on('error',e=>{
      if(e.type==='peer-unavailable'){ if(first) fail('그런 방이 없거나 방장이 접속해 있지 않아요.'); else { setNet('방장 기다리는 중…'); setTimeout(connect,4000); } }
      else if(first) fail('연결 실패 ('+e.type+')');
    });
    peer.on('disconnected',()=>{ if(active){ try{peer.reconnect()}catch(e){} } });
  });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && peer && peer.disconnected && active){ try{peer.reconnect()}catch(e){} } });

function getNick(){
  const n = ($('#nick')?.value || lsGet('gm_nick') || '플레이어').trim().slice(0,10) || '플레이어';
  lsSet('gm_nick', n); return n;
}
function busy(msg){ $('#app').innerHTML = '<h1>GEM MERCHANT</h1><div class="sub">'+esc(msg)+'</div>'; }
async function createRoom(){
  const nick=getNick();
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ';
  busy('방 만드는 중…');
  for(let tries=0;tries<4;tries++){
    let code=''; for(let i=0;i<4;i++) code+=L[Math.floor(Math.random()*L.length)];
    const data = {code, host:myId, status:'lobby', v:1, created:Date.now(), players:{[myId]:{name:nick, joined:Date.now()}}};
    try{ room=code; await startHost(code, data); lsSet('gm_doc_'+code, JSON.stringify(data)); lsSet('gm_hostof', code); return enterRoom(code); }
    catch(e){ room=null; if(e.type!=='unavailable-id') return renderHome('방 만들기 실패: 인터넷 연결을 확인해 주세요 ('+(e.type||e.message)+')'); }
  }
  renderHome('방 코드를 만들지 못했어요. 다시 시도해 주세요.');
}
async function joinRoom(code){
  if(!/^[A-Z]{4}$/.test(code)) return renderHome('4글자 방 코드를 입력해 주세요.');
  const nick=getNick();
  // 내가 방장이었던 방이면 저장된 게임으로 다시 열기
  const saved = lsGet('gm_doc_'+code);
  if(saved && lsGet('gm_hostof')===code){
    busy('내 방을 다시 여는 중…');
    try{ room=code; await startHost(code, JSON.parse(saved)); return enterRoom(code); }
    catch(e){ room=null; if(e.type==='unavailable-id') return renderHome('잠시 후 다시 시도해 주세요 (이전 연결이 아직 남아 있어요).'); return renderHome('방 다시 열기 실패 ('+(e.type||e.message)+')'); }
  }
  busy('방장에게 연결 중…');
  try{ room=code; await startClient(code); }catch(e){ room=null; return renderHome(e.message); }
  const d = DOC;
  if(!d){ return renderHome('그런 방이 없어요.'); }
  if(!d.players?.[myId]){
    if(d.status!=='lobby') return renderHome('이미 시작한 게임이에요.');
    if(Object.keys(d.players||{}).length>=4) return renderHome('방이 꽉 찼어요 (최대 4명).');
    try{ await db.doc().update({players:{[myId]:{name:nick, joined:Date.now()}}}); }
    catch(e){ return renderHome('참가 실패: '+e.message); }
  }
  enterRoom(code);
}
function stopListen(){ if(unsub){unsub();unsub=null} clearTimeout(loadTimer); }
function enterRoom(code){
  stopListen(); room=code; lsSet('gm_room',code); picks=[]; pending=null;
  unsub = db.doc().onSnapshot(s=>{
    if(!s.exists){ renderHome('방이 닫혔어요.'); return; }
    const d=s.data();
    const prevTurn = G?.turn;
    const prevRects = (G && G.status==='playing') ? captureRects() : {};
    const justStarted = G && G.status==='lobby' && d.status==='playing';
    G = clone(d);
    if(G.status==='playing' && prevTurn!==G.turn && curId()===myId && prevTurn!==undefined){ setTimeout(()=>toast('내 차례예요!'),900); picks=[]; }
    render();
    if(G.status==='playing'||G.status==='ended') animateLast(prevRects); else lastSeqSeen=null;
    if(justStarted) showOrder();
  });
}
function playersSorted(){ return Object.entries(G.players||{}).sort((a,b)=>a[1].joined-b[1].joined).map(x=>x[0]); }

async function leaveLobby(){
  if(G.status==='lobby' && G.players[myId]){
    const p = clone(G.players); delete p[myId];
    const ref = db.doc('games/'+room);
    try{
      if(isHost){ await ref.delete(); lsSet('gm_hostof',''); }
      else if(Object.keys(p).length===0) await ref.delete();
      else { const d=clone(G); d.players=p; if(d.host===myId) d.host=playersSortedFrom(p)[0]; d.v++; await ref.set(d); }
    }catch(e){}
  }
  lsSet('gm_room',''); renderHome();
}
function playersSortedFrom(p){ return Object.entries(p).sort((a,b)=>a[1].joined-b[1].joined).map(x=>x[0]); }

async function startGame(){
  const ref = db.doc('games/'+room);
  const s = await ref.get(); const d = clone(s.data());
  const ids = shuffle(playersSortedFrom(d.players));
  const n = ids.length; const t = n===2?4:n===3?5:7;
  const decks={}, board={};
  for(const tr of [1,2,3]){
    const all = shuffle(Object.keys(CARDS).filter(k=>CARDS[k].tier===tr));
    board[tr] = all.splice(0,4); decks[tr]=all;
  }
  Object.assign(d,{
    status:'playing', order:ids, turn:0, round:1, decks, board,
    nobles: shuffle(Object.keys(NOBLES)).slice(0,n+1),
    bank:{w:t,u:t,g:t,r:t,k:t,y:5},
    ps: Object.fromEntries(ids.map(id=>[id,{tokens:{w:0,u:0,g:0,r:0,k:0,y:0},cards:[],reserved:[],nobles:[]}])),
    target:d.target||15, log:[{t:'🎲 순서 랜덤 결정: '+ids.map(i=>d.players[i].name).join(' → ')},{t:'게임 시작! 목표 '+(d.target||15)+'점'}], last:null, finalRound:false, v:d.v+1
  });
  try{ await ref.set(d); }catch(e){ toast('시작 실패: '+e.message) }
}

const hash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function rng(seed){let s=seed||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return ((s>>>0)%10000)/10000}}
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const GEMC={w:['#e9eef6','#ffffff','#7f93b0'],u:['#2f6fd6','#9cc1ff','#163d80'],g:['#1f9d63','#86e6b8','#0d5534'],r:['#d6453d','#ffa197','#7a1712'],k:['#3b3330','#9a8c86','#0e0b0a']};
function gemSVG(c,cls='gsvg'){

  const [b,l,d]=GEMC[c];
  return `<svg viewBox="0 0 24 24" class="${cls}"><polygon points="6,3 18,3 23,9 12,22 1,9" fill="${b}" stroke="${d}" stroke-width="1.2" stroke-linejoin="round"/><polygon points="6,3 18,3 15,9 9,9" fill="${l}" opacity=".85"/><polygon points="1,9 9,9 12,22" fill="${d}" opacity=".35"/><polygon points="23,9 15,9 12,22" fill="${d}" opacity=".18"/><polygon points="9,9 15,9 12,22" fill="${l}" opacity=".28"/><polygon points="7,4.4 9.6,4.4 8,7.6" fill="#fff" opacity=".85"/></svg>`;
}

const NART={};
function nobleSVG(nid){

  s+=`<path d="M8 60 Q10 42 30 40 Q50 42 52 60Z" fill="${robe}" stroke="#2a2016" stroke-width=".6"/><path d="M24 41 L30 52 L36 41" fill="${trim}"/>`;
  s+=`<rect x="26" y="33" width="8" height="8" fill="${skin}"/><ellipse cx="30" cy="27" rx="9" ry="10.5" fill="${skin}"/>`;

  else if(v===1) s+=`<path d="M19 22 Q30 6 41 22 Q30 17 19 22Z" fill="${trim}"/><circle cx="36" cy="14" r="2.4" fill="#fff" opacity=".9"/><path d="M20 24 Q20 34 23 38" stroke="${hair}" stroke-width="3" fill="none"/><path d="M40 24 Q40 34 37 38" stroke="${hair}" stroke-width="3" fill="none"/>`;
  else if(v===2) s+=`<path d="M20 22 Q30 10 40 22 Q30 19 20 22Z" fill="#f2eee6" stroke="#b9b0a0" stroke-width=".6"/><circle cx="30" cy="16" r="2" fill="${robe}"/><path d="M24 33 Q30 39 36 33" stroke="${hair}" stroke-width="2.4" fill="none"/>`;
  else s+=`<path d="M20 27 Q20 14 30 14 Q40 14 40 27 L40 38 Q36 30 36 24 Q30 20 24 24 Q24 30 20 38Z" fill="${hair}"/><circle cx="30" cy="16" r="1.6" fill="#e8b923"/>`;
  s+=`<circle cx="26.5" cy="27" r="1" fill="#2a2016"/><circle cx="33.5" cy="27" r="1" fill="#2a2016"/><path d="M27.5 32 Q30 33.5 32.5 32" stroke="#7a3a2a" stroke-width=".8" fill="none"/>`;

// ===================== 게임 로직 =====================
const curId = ()=>G.order[G.turn];
const isMyTurn = ()=>G.status==='playing' && curId()===myId && !pending;
const PCOL=['#ff9f43','#4fa3ff','#5fd38d','#f368e0'];
function pcol(id){ const i=(G?.order||[]).indexOf(id); return i<0?'#aaa':PCOL[i]; }
function bonus(p){ const b={w:0,u:0,g:0,r:0,k:0}; p.cards.forEach(c=>b[CARDS[c].color]++); return b; }
function points(p){ return p.cards.reduce((s,c)=>s+CARDS[c].pts,0) + p.nobles.length*3; }
function tokTotal(p){ return Object.values(p.tokens).reduce((a,b)=>a+b,0); }
function payPlan(p, card){
  const b=bonus(p); const pay={w:0,u:0,g:0,r:0,k:0,y:0}; let gold=0;
  for(const c of C){
    const need=Math.max(0,(card.cost[c]||0)-b[c]);
    const use=Math.min(need,p.tokens[c]); pay[c]=use; gold+=need-use;
  }
  if(gold>p.tokens.y) return null;
  pay.y=gold; return pay;
}
function addLog(d,msg,p){ d.log=(d.log||[]).concat(p?{p,t:msg}:{t:msg}).slice(-30); }
function newLast(d,o){ d.last=Object.assign({seq:(G.v||0)+1, by:myId},o); }

function finishTurn(d){
  const id = d.order[d.turn]; const p = d.ps[id];
  const b=bonus(p);
  const nb = d.nobles.find(n=>Object.entries(NOBLES[n].req).every(([c,v])=>b[c]>=v));
  if(nb){ d.nobles=d.nobles.filter(x=>x!==nb); p.nobles.push(nb); addLog(d,'에게 귀족이 방문! (+3점)',id); if(d.last) d.last.noble=nb; }
  const tgt=d.target||15;
  if(points(p)>=tgt && !d.finalRound){ d.finalRound=true; addLog(d,tgt+'점 달성! 이번 라운드가 마지막이에요.',id); }
  d.turn=(d.turn+1)%d.order.length;
  if(d.turn===0){
    if(d.finalRound){
      d.status='ended';
      const rank = d.order.slice().sort((a,b)=>(points(d.ps[b])-points(d.ps[a]))||(d.ps[a].cards.length-d.ps[b].cards.length));
      d.rank=rank; addLog(d,'게임 종료! 우승: '+d.players[rank[0]].name);
    } else d.round++;
  }
  d.v=(d.v||0)+1;
}
async function commit(d){
  const ref=db.doc('games/'+room);
  try{
    const s=await ref.get(); const cur=s.data();
    if(!cur || cur.v!==G.v || cur.order[cur.turn]!==myId){ toast('게임 상태가 바뀌었어요. 다시 시도해 주세요.'); return; }
    await ref.set(d);
  }catch(e){ toast('전송 실패: '+(e.message||e.code)); }
}
function afterAction(d){
  picks=[]; closeModal();
  const p=d.ps[myId];
  if(tokTotal(p)>10){ pending={d, back:{w:0,u:0,g:0,r:0,k:0,y:0}}; render(); openDiscard(); return; }
  finishTurn(d); commit(d);
}
function doTake(){
  const d=clone(G); const p=d.ps[myId];
  const cnt={}; picks.forEach(c=>cnt[c]=(cnt[c]||0)+1);
  for(const c in cnt){ d.bank[c]-=cnt[c]; p.tokens[c]+=cnt[c]; }
  newLast(d,{type:'take',gems:cnt});
  addLog(d,'보석 '+picks.map(c=>CN[c]).join(', ')+' 가져감',myId);
  afterAction(d);
}
function doBuy(cid, from){
  const d=clone(G); const p=d.ps[myId]; const card=CARDS[cid];
  const pay=payPlan(p,card); if(!pay) return toast('보석이 부족해요');
  for(const c in pay){ p.tokens[c]-=pay[c]; d.bank[c]+=pay[c]; }
  let slot=-1;
  if(from==='res') p.reserved=p.reserved.filter(x=>x!==cid);
  else slot=replaceOnBoard(d,cid);
  p.cards.push(cid);
  newLast(d,{type:'buy',card:cid,from,tier:card.tier,slot,pay});
  addLog(d,CN[card.color]+' 카드 구매'+(card.pts?` (+${card.pts}점)`:''),myId);
  afterAction(d);
}
function doReserve(cid){
  const d=clone(G); const p=d.ps[myId];
  if(p.reserved.length>=3) return toast('예약은 최대 3장이에요');
  let id=cid, txt, slot=-1, tier, fromDeck=false;
  if(cid.startsWith('deck-')){ tier=+cid.slice(5); id=d.decks[tier].pop(); if(!id) return toast('덱이 비었어요'); txt=`${tier}단계 덱 맨 위 카드`; fromDeck=true; }
  else { tier=CARDS[cid].tier; slot=replaceOnBoard(d,cid); txt=CN[CARDS[cid].color]+' 카드'; }
  p.reserved.push(id);
  if(fromDeck) p.blind=(p.blind||[]).concat(id);
  let gold=0; if(d.bank.y>0){ d.bank.y--; p.tokens.y++; gold=1; }
  newLast(d,{type:'reserve',card:fromDeck?null:id,tier,slot,fromDeck,gold});
  addLog(d,txt+' 예약',myId);
  afterAction(d);
}
function replaceOnBoard(d,cid){
  const t=CARDS[cid].tier; const i=d.board[t].indexOf(cid);
  d.board[t][i] = d.decks[t].length ? d.decks[t].pop() : null;
  return i;
}
function availColors(){ return C.filter(c=>G.bank[c]>0).length; }
function pickValid(){
  if(!picks.length) return false;
  if(picks.length===2 && picks[0]===picks[1]) return true;
  const uniq=new Set(picks).size===picks.length;
  return uniq && picks.length===Math.min(3,availColors());
}
function tapToken(c){
  if(!isMyTurn()||c==='y') return;
  const same = picks.filter(x=>x===c).length;
  if(same===1 && picks.length===1){ if(G.bank[c]>=4) picks.push(c); else { toast('같은 색 2개는 더미가 4개 이상일 때만 가능해요'); picks=[]; } }
  else if(same>=1){ picks=picks.filter(x=>x!==c); }
  else if(picks.length===2 && picks[0]===picks[1]){ picks=[c]; }
  else if(picks.length<3 && G.bank[c]>0) picks.push(c);
  render();
}

// ===================== 그리기 =====================
const FRAME={w:'#d9d2c3',u:'#2f6fd6',g:'#1f9d63',r:'#d6453d',k:'#2a2321'};

function logHTML(l){

function holdHTML(p,big){

  const toks=[...C,'y'].map(c=>`<div class="ctok ${p.tokens[c]?'':'zero'}" style="--c:${CHEX[c]};--t:${CTXT[c]}">${p.tokens[c]}</div>`).join('');
  return `<div class="hold ${big?'big':''}"><div class="hl">🂠 카드</div>${cards}<div class="hl">● 보석</div>${toks}</div>`;

function render(){
  if(!G) return;
  if(G.status==='lobby') return renderLobby();
  const me=G.ps[myId]; const spectator=!me;
  const cur=curId();
  const turnTxt = G.status==='ended' ? '게임 종료' : (cur===myId ? '내 차례!' : esc(nameOf(cur))+'의 차례');

  const tiers=[3,2,1].map(t=>`<div class="tier">

      ${G.host===myId?'<button class="btn" id="again">같은 멤버로 다시 하기</button>':'<div class="muted" style="margin-top:8px">방장이 다시 시작할 수 있어요.</div>'}

      ${isMyTurn()&&picks.length?`<div class="actionbar"><button class="btn sec" id="clr">취소</button><button class="btn" id="take" ${canTake?'':'disabled'}>보석 가져오기</button></div>`:''}
    </div></div>`;
    const h=$('.me-panel').offsetHeight; $('#app').style.paddingBottom=(h+20)+'px';

let lastSeqSeen=null;
function rectOf(sel){ const el=document.querySelector(sel); if(!el) return null; const r=el.getBoundingClientRect(); return r.width?{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}:null; }

function fly(html, from, to, {delay=0, w=34, h=34, endScale=.55, dur=650, cls=''}={}){
  if(!from||!to) return;
  const el=document.createElement('div'); el.className='fly '+cls; el.innerHTML=html;
  Object.assign(el.style,{left:(from.x-w/2)+'px',top:(from.y-h/2)+'px',width:w+'px',height:h+'px'});
  document.body.appendChild(el);
  const dx=to.x-from.x, dy=to.y-from.y;
  const a=el.animate([
    {transform:'translate(0,0) scale(1)',opacity:0},
    {transform:'translate(0,-6px) scale(1.15)',opacity:1,offset:.12},
    {transform:`translate(${dx*.85}px,${dy*.85-18}px) scale(${(1+endScale)/2})`,opacity:1,offset:.8},
    {transform:`translate(${dx}px,${dy}px) scale(${endScale})`,opacity:0}
  ],{duration:dur,delay,easing:'cubic-bezier(.45,0,.25,1)',fill:'both'});
  a.onfinish=()=>el.remove();
}
function pulse(sel,delay){ setTimeout(()=>{ const el=document.querySelector(sel); if(!el) return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); },delay); }
function banner(L){
  const last=(G.log||[]).slice().reverse().find(l=>l&&l.p===L.by);
  if(!last) return;
  const b=$('#banner'); b.innerHTML=`<div class="bn" style="--pc:${pcol(L.by)}"><i class="dot" style="background:${pcol(L.by)}"></i><b>${esc(nameOf(L.by))}${L.by===myId?' (나)':''}</b> ${esc(last.t.replace(/^에게 /,''))}</div>`;
  clearTimeout(banner._t); banner._t=setTimeout(()=>b.innerHTML='',2400);
}
function animateLast(prev){
  const L=G.last;
  if(!L){ return; }
  if(lastSeqSeen===null || L.seq<=lastSeqSeen){ lastSeqSeen=Math.max(lastSeqSeen||0,L.seq); return; }
  lastSeqSeen=L.seq;
  const P=playerPoint(L.by); let k=0;
  banner(L);
  pulse(L.by===myId?'.me-panel':`.opp[data-pid="${L.by}"]`, 550);
  if(L.type==='take'){
    for(const c in L.gems) for(let i=0;i<L.gems[c];i++) fly(chipHTML(c), rectOf(`[data-tok="${c}"]`), P, {delay:k++*110});
  }
  if(L.type==='buy' || L.type==='reserve'){
    let from = L.slot>=0 ? prev['slot-'+L.tier+'-'+L.slot] : (L.fromDeck ? prev['deck-'+L.tier] : (prev['res-'+L.card] || P));
    const html = L.card && !(L.type==='reserve' && L.by!==myId && L.fromDeck) ? cardHTML(L.card,'','data-x') : backHTML(L.tier);
    fly(html, from, P, {w:from?from.w:60, h:from?from.h:80, endScale:.35, dur:800, cls:'flycard'});
    if(L.type==='buy' && L.pay){
      for(const c in L.pay) for(let i=0;i<L.pay[c];i++) fly(chipHTML(c), P, rectOf(`[data-tok="${c}"]`), {delay:350+k++*90});
    }
    if(L.gold) fly(chipHTML('y'), rectOf('[data-tok="y"]'), P, {delay:300});
    if(L.slot>=0) setTimeout(()=>{ const el=document.querySelector(`[data-slot="${L.tier}-${L.slot}"] .gc`); if(el){ el.classList.add('deal'); } }, 0);
  }
  if(L.back){ for(const c in L.back) for(let i=0;i<L.back[c];i++) fly(chipHTML(c), P, rectOf(`[data-tok="${c}"]`), {delay:700+k++*90}); }
  if(L.noble && prev['noble-'+L.noble]){
    fly(`<div class="noble">${nobleSVG(L.noble)}</div>`, prev['noble-'+L.noble], P, {w:62,h:62,endScale:.4,delay:900,dur:900,cls:'flycard'});
  }
}

function showOrder(){
  const el=document.createElement('div'); el.className='order-pop';
  el.innerHTML=`<div class="op-in"><div class="op-t">🎲 순서 결정!</div>${G.order.map((id,i)=>`<div class="op-r" style="--pc:${pcol(id)};animation-delay:${.35+i*.35}s"><b>${i+1}</b> ${esc(nameOf(id))}${id===myId?' (나)':''}</div>`).join('')}<div class="tiny" style="margin-top:8px">목표 ${G.target||15}점 · 탭하면 닫혀요</div></div>`;
  el.onclick=()=>el.remove(); document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1600+G.order.length*350);
}
// ===================== 모달 =====================
function openModal(html){ $('#modal').innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet">${html}</div></div>`; $('#bg').onclick=e=>{ if(e.target.id==='bg' && !pending) closeModal(); }; }
function closeModal(){ $('#modal').innerHTML=''; }
function openCard(cid, from){
  const c=CARDS[cid]; const me=G.ps[myId];
  const my=isMyTurn() && me && from!=='opp';
  const pay = me ? payPlan(me,c) : null;
  const payTxt = pay ? Object.entries(pay).filter(([k,v])=>v).map(([k,v])=>`${CN[k]} ${v}`).join(', ') || '무료 (할인으로 충분!)' : '';
  const kind = c.tier===1?'광산':c.tier===2?(hash(cid)%2?'상선':'상단'):'도시';
  openModal(`<h3>${CN[c.color]} ${kind} · ${c.pts}점</h3>
    <div class="bigcard">${cardHTML(cid,'','data-big')}</div>
    <div class="muted" style="text-align:center">비용: ${C.filter(k=>c.cost[k]).map(k=>CN[k]+' '+c.cost[k]).join(', ')}</div>
    ${my ? (pay?`<div class="muted" style="text-align:center;margin-top:4px">지불: ${payTxt}</div>`:`<div class="err" style="text-align:center">보석이 부족해요</div>`) : `<div class="muted" style="text-align:center;margin-top:6px">${from==='opp'?'상대가 찜한 카드예요 (상대만 살 수 있어요)':G.status==='playing'?'내 차례가 아니에요':''}</div>`}
    ${my?`<button class="btn" id="buy" ${pay?'':'disabled'}>구매하기</button>`:''}
    ${my&&from==='board'?`<button class="btn sec" id="rsv" ${me.reserved.length>=3?'disabled':''}>예약하기 ${G.bank.y?'(+황금 1)':''}</button>`:''}
    <button class="btn sec" id="cl">닫기</button>`);
  $('#cl').onclick=closeModal;
  $('#buy') && ($('#buy').onclick=()=>doBuy(cid,from));
  $('#rsv') && ($('#rsv').onclick=()=>doReserve(cid));
}
function openDeck(t){
  const me=G.ps[myId];
  if(!isMyTurn()) return toast(`${t}단계 덱: ${G.decks[t].length}장 남음`);
  if(!G.decks[t].length) return toast('덱이 비었어요');
  openModal(`<h3>${t}단계 덱 (${G.decks[t].length}장)</h3><p class="muted">덱 맨 위 카드를 보지 않고 예약해요. 다른 사람은 무슨 카드인지 몰라요.</p>
    <button class="btn" id="rsv" ${me.reserved.length>=3?'disabled':''}>덱에서 예약하기 ${G.bank.y?'(+황금 1)':''}</button><button class="btn sec" id="cl">닫기</button>`);
  $('#cl').onclick=closeModal; $('#rsv').onclick=()=>doReserve('deck-'+t);
}
function openDiscard(){
  const {d,back}=pending; const p=d.ps[myId];
  const total=tokTotal(p)-Object.values(back).reduce((a,b)=>a+b,0);
  const over=total-10;
  openModal(`<h3>보석이 너무 많아요</h3><p class="muted">10개가 되도록 <b>${Math.max(over,0)}개</b>를 더 돌려놓아 주세요. (탭해서 선택)</p>
    <div class="bank" style="background:var(--panel2)">${[...C,'y'].map(c=>{const left=p.tokens[c]-back[c];return `<button class="tok" data-dc="${c}" ${left<=0||over<=0?'disabled':''}>${chipHTML(c,left)}<span class="tiny">${CN[c]}</span>${back[c]?`<span class="pick">-${back[c]}</span>`:''}</button>`}).join('')}</div>
    <div class="actionbar"><button class="btn sec" id="rs">다시 고르기</button><button class="btn" id="ok" ${over===0?'':'disabled'}>확정</button></div>`);
  document.querySelectorAll('[data-dc]').forEach(el=>el.onclick=()=>{back[el.dataset.dc]++;openDiscard()});
  $('#rs').onclick=()=>{for(const k in back)back[k]=0;openDiscard()};
  $('#ok').onclick=()=>{
    for(const c in back){ p.tokens[c]-=back[c]; d.bank[c]+=back[c]; }
    const n=Object.values(back).reduce((a,b)=>a+b,0);
    if(d.last) d.last.back=Object.fromEntries(Object.entries(back).filter(([k,v])=>v));
    addLog(d,'보석 '+n+'개 반납',myId);
    pending=null; closeModal(); finishTurn(d); commit(d);
  };
}
function openMenu(){
  const host=G.host===myId;
  openModal(`<h3>메뉴</h3>
    <div class="muted">방 코드: <b style="color:var(--accent)">${esc(G.code)}</b></div>
    <div class="help"><ul>
      <li>보석 칩을 탭해 고르고 <b>보석 가져오기</b>를 누르세요. 같은 색을 두 번 탭하면 2개.</li>
      <li>카드를 탭하면 구매/예약. 금색 테두리 = 지금 살 수 있는 카드.</li>
      <li>덱(Ⅰ Ⅱ Ⅲ)을 탭하면 맨 위 카드를 몰래 예약.</li>
      <li>상대 줄의 숫자: 카드 할인 수 +보유 보석 수.</li></ul></div>
    ${host&&G.status==='playing'?'<button class="btn sec" id="skip">현재 차례 건너뛰기 (자리 비움)</button><button class="btn sec" id="rst">게임 다시 시작</button>':''}
    <button class="btn sec" id="out">${isHost?'방 나가기 (같은 폰에서 코드로 다시 열 수 있어요)':'방 나가기 (코드로 다시 참가 가능)'}</button>
    <button class="btn" id="cl">닫기</button>`);
  $('#cl').onclick=closeModal;
  $('#out').onclick=()=>{closeModal();renderHome()};
  $('#skip')&&($('#skip').onclick=async()=>{const d=clone(G);addLog(d,'차례 건너뜀',curId());d.last=null;finishTurn(d);closeModal();try{await db.doc('games/'+room).set(d)}catch(e){toast(e.message)}});
  $('#rst')&&($('#rst').onclick=()=>{closeModal();restart()});
}
async function restart(){
  const d=clone(G);
  const keep={code:d.code,host:d.host,status:'lobby',v:(d.v||0)+1,created:Date.now(),players:d.players};
  try{ await db.doc('games/'+room).set(keep); }catch(e){ toast(e.message) }
}

if(typeof Peer==='undefined'){ $('#app').innerHTML='<h1>GEM MERCHANT</h1><div class="card-box">연결 모듈을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'; }
else renderHome();
</script>
